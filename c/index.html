<title>بطاقة معايدة — اكتب اسمك واحفظها</title>

<meta name="description" content="افتح البطاقة، اكتب اسمك ليظهر عليها، واحفظها صورة بجودة عالية. كل عام وأنتم بخير.">
<meta property="og:title" content="بطاقة معايدة — اكتب اسمك واحفظها"><meta property="og:description" content="افتح البطاقة، اكتب اسمك ليظهر عليها، واحفظها صورة بجودة عالية. كل عام وأنتم بخير."><meta property="og:type" content="website"><meta property="og:image" content="https://eidcard.majoodah.com/img/og.jpg">

<body>
<style>
:root{--bg:#0f3b33;--bg2:#05201b;--fg:#f6ecd2;--acc:#d9b45a;--f-b:"IBM Plex Sans Arabic","Segoe UI",Tahoma,"Geeza Pro",sans-serif;--f-d:"Baloo Bhaijaan 2","IBM Plex Sans Arabic",Tahoma,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
html{background:var(--bg2)}
body{background:radial-gradient(120% 80% at 50% 0%,var(--bg),var(--bg2));background-attachment:fixed;color:var(--fg);font-family:var(--f-b);font-size:16px;line-height:1.7;direction:rtl}
.wrap{max-width:520px;margin:0 auto;padding:22px 16px 40px;display:flex;flex-direction:column;gap:16px;min-height:100vh}
h1{font-family:var(--f-d);font-size:20px;margin:0;text-align:center;line-height:1.5}
.sub{text-align:center;opacity:.8;font-size:14px;margin-top:-10px}
.card{border-radius:12px;overflow:hidden;box-shadow:0 18px 60px rgba(0,0,0,.35),0 4px 14px rgba(0,0,0,.18);background:rgba(255,255,255,.06)}
canvas{width:100%;height:auto;display:block}
label{font-size:14px;opacity:.9;display:block;margin-bottom:6px}
input{width:100%;padding:14px 16px;border-radius:12px;border:2px solid var(--acc);background:#fffdf7;color:#1a2e45;font:inherit;font-size:18px;outline:none}
input:focus{box-shadow:0 0 0 4px rgba(255,255,255,.18)}
.btns{display:flex;gap:10px}
button{flex:1;padding:14px;border-radius:12px;border:0;font:inherit;font-weight:700;font-size:17px;cursor:pointer;background:var(--acc);color:var(--bg2);transition:transform .15s}
button:hover{transform:translateY(-1px)}button.alt{background:rgba(255,255,255,.12);color:var(--fg);border:1px solid rgba(255,255,255,.25)}
button:disabled{opacity:.6}
.hint{font-size:13px;opacity:.75;text-align:center}
.foot{margin-top:auto;text-align:center;font-size:12.5px;opacity:.7}.foot a{color:inherit}
.state{text-align:center;padding:60px 10px;opacity:.9}
.spin{width:38px;height:38px;border:3px solid rgba(255,255,255,.25);border-top-color:var(--acc);border-radius:50%;margin:0 auto 14px;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
</style>
<div class="wrap" id="w">
 <div class="state" id="state"><div class="spin"></div>جارٍ تحميل البطاقة…</div>
 <div id="ui" hidden>
  <h1 id="ttl">بطاقة معايدة</h1>
  <div class="sub" id="ttl2"></div>
  <div class="card"><canvas id="cv" width="1080" height="1350" aria-label="بطاقة المعايدة"></canvas></div>
  <div><label for="nm" id="lbl">اكتب اسمك</label><input id="nm" type="text" maxlength="40" autocomplete="name"></div>
  <div class="btns"><button id="save">حفظ البطاقة</button><button class="alt" id="share" hidden>مشاركة</button></div>
  <div class="hint" id="hint">صورة PNG بجودة عالية</div>
 </div>
 <div class="foot">صمّم بطاقة معايدة لعائلتك أو شركتك — <a href="https://eidcard.majoodah.com/" target="_blank" rel="noopener">مجودة</a></div>
